name: CI

on:
  push:
    branches: [main]
    paths:
      - "einvoice_erpgulf/**"
      - ".github/workflows/frappe-ci.yml"
  pull_request:
    paths:
      - "einvoice_erpgulf/**"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: Install on a fresh site (Frappe ${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch: [version-15, version-16]

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          path: apps/einvoice_erpgulf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server mariadb-client libmariadb-dev libcups2-dev
          sudo service redis-server start

      - name: Setup bench
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch ${{ matrix.branch }} --python "$(which python)" ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install apps
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch ${{ matrix.branch }}
          bench get-app einvoice_erpgulf $GITHUB_WORKSPACE/apps/einvoice_erpgulf
          bench setup requirements
          bench new-site --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%' test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app einvoice_erpgulf
        env:
          CI: "Yes"

      - name: Smoke checks
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site execute einvoice_erpgulf.core.registry.registered_providers
          bench --site test_site run-tests --app einvoice_erpgulf
        env:
          TYPE: server
